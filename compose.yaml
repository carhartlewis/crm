# Local development infrastructure: `docker compose up -d`.
name: crm
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: crm
    command: ["postgres", "-c", "wal_level=logical"] # ElectricSQL needs logical replication
    ports: ["55432:5432"]
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crm"]
      interval: 2s
      retries: 30
  redis:
    image: redis:8-alpine
    ports: ["56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30
  # ElectricSQL sync engine. Browsers never reach it: the API's authenticated shape proxy
  # (/api/shapes/*) adds the table, the workspace filter and this secret. Loopback only.
  electric:
    image: electricsql/electric:1.8.1
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/crm?sslmode=disable
      ELECTRIC_SECRET: ${ELECTRIC_SECRET:-crm-local-electric-secret-change-me}
      ELECTRIC_STORAGE_DIR: /var/lib/electric
    ports: ["127.0.0.1:53000:3000"]
    volumes: [electric:/var/lib/electric]
    healthcheck:
      # 200 only once Electric holds the replication lock and serves shapes (202 while starting).
      test:
        [
          "CMD-SHELL",
          'test "$$(curl -s -o /dev/null -w ''%{http_code}'' http://localhost:3000/v1/health)" = 200',
        ]
      interval: 2s
      retries: 60
  # S3-compatible object storage for images (profile pictures, workspace favicons). RustFS,
  # because MinIO no longer publishes community images. Deployments use Vercel Blob instead.
  storage:
    image: rustfs/rustfs@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
    environment:
      RUSTFS_ACCESS_KEY: crm-local
      RUSTFS_SECRET_KEY: crm-local-secret
      RUSTFS_VOLUMES: /data
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: warn
    ports: ["127.0.0.1:59000:9000", "127.0.0.1:59001:9001"]
    volumes: [storage:/data]
    # Healthy once the `crm` bucket exists with a policy that makes only `public/` anonymously
    # readable; the check creates both on first run (a one-shot init container would fail
    # `docker compose up --wait`).
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          s3() { curl -fsS -o /dev/null --aws-sigv4 aws:amz:us-east-1:s3 --user crm-local:crm-local-secret "$$@"; };
          curl -fs -o /dev/null http://localhost:9000/health &&
          { s3 "http://localhost:9000/crm?policy" 2>/dev/null ||
          { { s3 -I http://localhost:9000/crm 2>/dev/null || s3 -X PUT http://localhost:9000/crm; } &&
          s3 -X PUT -H "Content-Type: application/json" "http://localhost:9000/crm?policy"
          --data-binary '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"AWS":["*"]},"Action":["s3:GetObject"],"Resource":["arn:aws:s3:::crm/public/*"]}]}'; }; }
      interval: 2s
      retries: 30
volumes:
  postgres:
  electric:
  storage:
