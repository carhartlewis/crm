# Local development infrastructure: `docker compose up -d`.
name: crm
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: crm
    command: ["postgres", "-c", "wal_level=logical"] # ElectricSQL needs logical replication
    ports: ["55432:5432"]
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crm"]
      interval: 2s
      retries: 30
  redis:
    image: redis:8-alpine
    ports: ["56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30
  # ElectricSQL sync engine. Browsers never reach it: the API's authenticated shape proxy
  # (/api/shapes/*) adds the table, the workspace filter and this secret. Loopback only.
  electric:
    image: electricsql/electric:1.8.1
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/crm?sslmode=disable
      ELECTRIC_SECRET: ${ELECTRIC_SECRET:-crm-local-electric-secret-change-me}
      ELECTRIC_STORAGE_DIR: /var/lib/electric
    ports: ["127.0.0.1:53000:3000"]
    volumes: [electric:/var/lib/electric]
    healthcheck:
      # 200 only once Electric holds the replication lock and serves shapes (202 while starting).
      test:
        [
          "CMD-SHELL",
          'test "$$(curl -s -o /dev/null -w ''%{http_code}'' http://localhost:3000/v1/health)" = 200',
        ]
      interval: 2s
      retries: 60
volumes:
  postgres:
  electric:
